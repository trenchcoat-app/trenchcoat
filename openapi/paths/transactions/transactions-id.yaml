parameters:
  - name: id
    in: path
    required: true
    description: Transaction ID
    schema:
      type: string
      format: uuid

get:
  summary: Get-Transaction
  description: Retrieve a single transaction.
  operationId: getTransaction
  responses:
    "200":
      description: Successfully retrieved transaction
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/transactions/Transaction.yaml"
    "401":
      description: Unauthorized (i.e. missing or invalid credentials)
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "404":
      description: Transaction not found
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
put:
  summary: Update-Transaction
  description: Update an existing transaction.
  operationId: updateTransaction
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/transactions/Transaction.yaml"
  responses:
    "200":
      description: Successfully created a new transaction
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/transactions/Transaction.yaml"
    "400":
      description: Bad Request (e.g., malformed JSON payload)
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "401":
      description: Unauthorized (i.e. incorrect credentials)
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "422":
      description: Unprocessable Entity (e.g. input validation failed)
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "429":
      description: Too Many Requests (rate limit exceeded)
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"