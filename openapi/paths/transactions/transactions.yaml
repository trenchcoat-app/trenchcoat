get:
  summary: Get-Transactions
  description: Retrieve a list of transaction summaries that the authenticated user has permission to view.
  operationId: getTransactions
  parameters:
    - name: limit
      in: query
      required: false
      description: Maximum number of transactions to return.
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    - name: cursor
      in: query
      required: false
      description: Cursor for fetching the next page of results.
      schema:
        type: string
  responses:
    "200":
      description: Successfully retrieved transactions
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/transactions/TransactionList.yaml"
    "401":
      description: Unauthorized (i.e. incorrect credentials)
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "429":
      description: Too Many Requests (rate limit exceeded)
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
post:
  summary: Create-Transaction
  description: Create a new transaction.
  operationId: createTransaction
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/transactions/Transaction.yaml"
  responses:
    "200":
      description: Successfully created a new transaction
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/transactions/Transaction.yaml"
    "400":
      description: Bad Request (e.g., malformed JSON payload)
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "401":
      description: Unauthorized (i.e. incorrect credentials)
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "422":
      description: Unprocessable Entity (e.g. input validation failed)
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "429":
      description: Too Many Requests (rate limit exceeded)
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ErrorResponse.yaml"
