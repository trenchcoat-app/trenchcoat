type: object
required:
  - amount
  - currencyCode
  - title
  - funders
  - items
properties:
  id:
    type: string
    format: uuid
  amount:
    type: integer
    description: Amount in the smallest currency unit (e.g. cents).
  currencyCode:
    type: string
  title:
    type: string
  notes:
    type: string
  funders:
    type: array
    items:
      $ref: "./UpdateTransactionFunder.yaml"
  items:
    type: array
    items:
      $ref: "./UpdateTransactionItem.yaml"
