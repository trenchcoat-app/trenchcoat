type: object
required:
  - splitOwnerId
  - amount
  - percentOfTotal
  - splitType
properties:
  id:
    type: string
    format: uuid
  splitOwnerId:
    type: string
    format: uuid
    description: Account ID of the user responsible for paying for this portion of the item.
  amount:
    type: integer
    description: Amount in the smallest currency unit (e.g. cents).
  percentOfTotal:
    type: number
    format: float
  splitType:
    $ref: ./TransactionItemSplitTypeEnum.yaml"