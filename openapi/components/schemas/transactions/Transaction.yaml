type: object
required:
  - amount
  - currencyCode
  - title
  - funders
  - items
properties:
  id:
    type: string
    format: uuid
  amount:
    type: integer
    description: Amount in the smallest currency unit (e.g. cents).
  currencyCode:
    type: string
    description: Three-letter currency code compliant with ISO 4217.
    example: USD
  title:
    type: string
  notes:
    type: string
  funders:
    type: array
    items:
      $ref: "./TransactionFunder.yaml"
  items:
    type: array
    items:
      $ref: "./TransactionItem.yaml"
